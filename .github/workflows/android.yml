
name: OverLoad ZIP to APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Find and extract ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted

          ZIP_FILE="OverLoad-Android.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Missing $ZIP_FILE"
            exit 1
          fi

          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          target = Path("extracted").resolve()
          with zipfile.ZipFile("OverLoad-Android.zip") as z:
              for item in z.infolist():
                  p = Path(item.filename)
                  if (p.is_absolute()
                      or ".." in p.parts
                      or (item.external_attr >> 16) & 0o170000
                          == 0o120000):
                      raise ValueError("Unsafe ZIP entry")
              z.extractall(target)
          PY

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=$(find extracted \
            -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "::error::Android source missing"
            exit 1
          fi

          DIR=$(dirname "$PROJECT")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output

          find "$PROJECT_DIR" \
            -path "*/build/outputs/apk/debug/*.apk" \
            -type f \
            -exec cp {} output/ \;

          if ! compgen -G "output/*.apk" > /dev/null; then
            echo "::error::APK not found"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OverLoad-Android-APK
          path: output/*.apk
          retention-days: 30
          if-no-files-found: error
