
name: OverLoad ZIP to APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "OverLoad-Android.zip"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "Finding Android SDK..."

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK not found"
            exit 1
          fi

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager \
            -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          echo "SDK manager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses \
            > /dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK ready"

      - name: Find ZIP file
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="OverLoad-Android.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::OverLoad-Android.zip missing"
            exit 1
          fi

          echo "ZIP found"
          ls -lh "$ZIP_FILE"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          from stat import S_IFMT, S_IFLNK

          zip_path = Path("OverLoad-Android.zip")
          target = Path("extracted").resolve()

          with zipfile.ZipFile(zip_path) as archive:
              for item in archive.infolist():
                  path = Path(item.filename)

                  if path.is_absolute() or ".." in path.parts:
                      raise ValueError(
                          f"Unsafe ZIP path: {item.filename}"
                      )

                  mode = item.external_attr >> 16
                  if S_IFMT(mode) == S_IFLNK:
                      raise ValueError(
                          f"Symlink not allowed: {item.filename}"
                      )

              archive.extractall(target)

          print("ZIP extracted successfully")
          PY

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_FILE=$(find extracted \
            -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::Android Gradle project not found"
            find extracted -maxdepth 3 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" \
            >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug \
              --no-daemon \
              --stacktrace
          else
            gradle assembleDebug \
              --no-daemon \
              --stacktrace
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          find "$PROJECT_DIR" \
            -path "*/build/outputs/apk/debug/*.apk" \
            -type f \
            -exec cp {} output/ \;

          if ! compgen -G "output/*.apk" > /dev/null; then
            echo "::error::No APK generated"
            exit 1
          fi

          echo "APK files:"
          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OverLoad-Language-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Summary
        if: success()
        shell: bash
        run: |
          echo "## Android APK Build Success" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "Download APK from Artifacts." \
            >> "$GITHUB_STEP_SUMMARY"
