
name: Build Android APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' archives < <(
            find . -type f -iname '*.zip' \
              -not -path './.git/*' -print0 | sort -z
          )
          if (( ${#archives[@]} != 1 )); then
            echo "Expected exactly one ZIP; found ${#archives[@]}."
            exit 1
          fi
          echo "path=${archives[0]}" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP safely
        env:
          ZIP_PATH: ${{ steps.zip.outputs.path }}
        run: |
          python3 - <<'PY'
          import os, pathlib, stat, zipfile

          source = pathlib.Path(os.environ['ZIP_PATH'])
          destination = pathlib.Path('extracted').resolve()
          destination.mkdir(exist_ok=True)

          with zipfile.ZipFile(source) as z:
              for info in z.infolist():
                  path = pathlib.PurePosixPath(info.filename)
                  if path.is_absolute() or '..' in path.parts or '\\' in info.filename:
                      raise ValueError(f'Unsafe path: {info.filename}')
                  if (info.external_attr >> 16) & 0o170000 == stat.S_IFLNK:
                      raise ValueError(f'Symlink not allowed: {info.filename}')
                  target = (destination / info.filename).resolve()
                  if not target.is_relative_to(destination):
                      raise ValueError(f'Unsafe path: {info.filename}')
              z.extractall(destination)
          PY

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' projects < <(
            find extracted -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -print0
          )
          if (( ${#projects[@]} != 1 )); then
            echo "Expected exactly one Android Gradle project; found ${#projects[@]}."
            exit 1
          fi
          project_dir="$(dirname "${projects[0]}")"
          echo "dir=$project_dir" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [[ -f gradlew ]]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: extracted/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
